<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Application</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        .title { text-align: center; }
        button { background: #fff; color: #000; border: 1px solid #000; padding: 4px 10px; cursor: pointer; }
        button:hover { background: #000; color: #fff; }
        #add-post-btn { margin-bottom: 16px; }
        .post { border: 1px solid #000; padding: 16px; margin-bottom: 16px; }
        .post-header { display: flex; align-items: center; gap: 12px; }
        .post-header h3 { margin: 0; }
        .post-actions { display: flex; gap: 8px; }
        .empty { text-align: center; }
    </style>
</head>
<body>
    <h1 class="title">Blog Post Application</h1>
    <section>
        <button id="add-post-btn">Add Blog Post</button>
        <div id="blog-posts-container">

        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
